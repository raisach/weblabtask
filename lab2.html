<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pental Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Welcome to Pental Shop</h1>

    <table>
        <tr>
            <th>Item Name</th>
            <th>Quantity</th>
            <th>Status</th>
        </tr>
        <tr>
            <td>Pencils</td>
            <td>100</td>
            <td>In Stock</td>
        </tr>
        <tr>
            <td>Notebooks</td>
            <td>50</td>
            <td>Low Stock</td>
        </tr>
        <tr>
            <td>Markers</td>
            <td>15</td>
            <td>In Stock</td>
        </tr>
    </table>

    <div class="form-box">
        <h2>Contact Information</h2>
        <form>
            <div class="row">
                <label>Name</label>
                <input type="text">
            </div>
            <div class="row">
                <label>Email</label>
                <input type="email">
            </div>
            <div class="row">
                <label>Message</label>
                <textarea rows="4"></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>

</div>

</body>
</html>
